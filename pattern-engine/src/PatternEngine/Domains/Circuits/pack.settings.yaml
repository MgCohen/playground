# Settings of the circuits pack. They override pe.settings.yaml for this pack only.
# The behavior grader simulates the circuit and checks the full truth table. The built grader stays, but the
# expected tree has no parts, so another correct inner circuit also passes.
grading:
  output: [structure, rules, behavior, questions]   # the truth table is the expected output
  solution: [selection, built, proposed]
eval:
  generator:
    count: 4
    object_template: "Build {text}."
    group_template: "Build {group} with: {list}."
  sample_buckets: [no-fit, near-miss, object]
grader_trust:
  case_sets:
    - { count: 4, seed: 7, max_children: 2 }

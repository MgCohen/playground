# Hand cases: the situations that the generator does not make.
- id: hand-near-001
  tags: [near-miss-easy]
  request: Draw a tall, narrow building with a pointed roof and a door.
  expect: { outcome: match, tree: { p: tower, v: plain } }
- id: hand-near-002
  tags: [near-miss-easy]
  request: Draw a small cottage with a chimney.
  expect: { outcome: match, tree: { p: house, v: chimney } }
- id: hand-near-003
  tags: [near-miss-easy]
  request: Draw a skinny building, three times as tall as it is wide, with two windows.
  expect: { outcome: match, tree: { p: tower, v: plain } }
- id: hand-nofit-001
  tags: [no-fit]
  request: Draw a lighthouse.
  expect: { outcome: no-fit, nearest: tower }
- id: hand-nofit-002
  tags: [no-fit]
  request: Draw a windmill.
  expect: { outcome: no-fit, nearest: tower }
- id: hand-nofit-003
  tags: [no-fit]
  request: Draw a camping tent.
  expect: { outcome: no-fit, nearest: [house, tower, shed] }
# Near-miss: the words point to one pattern; only a do_not_use_when rule gives the correct one.
- id: hand-rule-001
  tags: [near-miss]
  request: Draw a narrow house, four floors tall, with a red door.
  expect: { outcome: match, tree: { p: tower, v: plain, params: { door_fill: red } } }
- id: hand-rule-002
  tags: [near-miss]
  request: Draw a little house where we keep our bikes.
  expect: { outcome: match, tree: { p: shed, v: plain } }
- id: hand-rule-003
  tags: [near-miss]
  request: Draw a tower that is low and wide, where a family lives.
  expect: { outcome: match, tree: { p: house } }
- id: hand-rule-004
  tags: [near-miss]
  request: Draw a garage that a family has made into their home.
  expect: { outcome: match, tree: { p: house } }
# Ask: the request does not give a needed fact. The simulated user gives it only when the engine asks.
- id: hand-ask-001
  tags: [ask]
  request: Draw a sign.
  hidden: { board_fill: green }
  expect: { outcome: match, tree: { p: sign, v: plain, params: { board_fill: green } }, asks: [board_fill] }
- id: hand-ask-002
  tags: [ask]
  request: Draw a street with, from left to right, a house and a sign.
  hidden: { board_fill: red }
  expect: { outcome: match, tree: { p: street, v: row, parts: [ { p: house }, { p: sign, params: { board_fill: red } } ] }, asks: [board_fill] }
- id: hand-ask-003
  tags: [ask]
  request: Draw a building.
  hidden: { pattern choice: house }
  expect: { outcome: match, tree: { p: house }, asks: [pattern choice] }
- id: hand-ask-004
  tags: [ask]
  request: Write me a short poem about the sea.
  expect: { outcome: ask, asks: [domain] }

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="gray"/></g>
    <g data-p="house" data-v="chimney">
      <g data-p="body"><rect x="20" y="190" width="100" height="60" fill="yellow"/></g>
      <g data-p="roof"><polygon points="10,190 130,190 70,140" fill="red"/></g>
      <g data-p="door"><rect x="60" y="220" width="20" height="30" fill="brown"/></g>
      <g data-p="window"><rect x="30" y="200" width="20" height="20" fill="blue"/></g>
      <g data-p="chimney"><rect x="90" y="150" width="15" height="20" fill="gray"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="170" y="140" width="50" height="110" fill="orange"/></g>
      <g data-p="roof"><polygon points="165,140 225,140 195,100" fill="red"/></g>
      <g data-p="door"><rect x="185" y="220" width="20" height="30" fill="brown"/></g>
      <g data-p="window"><rect x="188" y="160" width="14" height="15" fill="blue"/></g>
      <g data-p="window"><rect x="188" y="185" width="14" height="15" fill="blue"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="300" y="200" width="20" height="50" fill="brown"/></g>
      <g data-p="crown"><circle cx="310" cy="185" r="35" fill="green"/></g>
    </g>
  </g>
</svg>

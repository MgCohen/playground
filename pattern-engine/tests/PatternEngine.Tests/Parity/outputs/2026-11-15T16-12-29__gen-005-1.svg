<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="gray"/></g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="40" y="200" width="20" height="50" fill="brown"/></g>
      <g data-p="crown"><circle cx="50" cy="190" r="30" fill="green"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="130" y="130" width="40" height="120" fill="#cccccc"/></g>
      <g data-p="roof"><polygon points="125,130 175,130 150,100" fill="brown"/></g>
      <g data-p="door"><rect x="142" y="225" width="16" height="25" fill="brown"/></g>
      <g data-p="window"><rect x="142" y="150" width="16" height="16" fill="blue"/></g>
      <g data-p="window"><rect x="142" y="180" width="16" height="16" fill="blue"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="240" y="190" width="100" height="60" fill="#f5deb3"/></g>
      <g data-p="roof"><polygon points="230,190 350,190 290,150" fill="gray"/></g>
      <g data-p="door"><rect x="280" y="220" width="20" height="30" fill="red"/></g>
      <g data-p="window"><rect x="250" y="205" width="20" height="20" fill="blue"/></g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<g data-p="street" data-v="row">
<g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="green"/></g>
<g data-p="tower" data-v="plain">
<g data-p="body"><rect x="20" y="100" width="60" height="150" fill="gray"/></g>
<g data-p="roof"><polygon points="15,100 85,100 50,60" fill="brown"/></g>
<g data-p="door"><rect x="40" y="215" width="20" height="35" fill="red"/></g>
<g data-p="window"><rect x="42" y="125" width="16" height="16" fill="white"/></g>
</g>
<g data-p="house" data-v="plain">
<g data-p="body"><rect x="130" y="190" width="100" height="60" fill="orange"/></g>
<g data-p="roof"><polygon points="120,190 240,190 180,150" fill="brown"/></g>
<g data-p="door"><rect x="170" y="215" width="20" height="35" fill="yellow"/></g>
<g data-p="window"><rect x="195" y="205" width="20" height="20" fill="white"/></g>
</g>
<g data-p="house" data-v="chimney">
<g data-p="body"><rect x="280" y="190" width="100" height="60" fill="orange"/></g>
<g data-p="roof"><polygon points="270,190 390,190 330,150" fill="brown"/></g>
<g data-p="door"><rect x="320" y="215" width="20" height="35" fill="brown"/></g>
<g data-p="window"><rect x="350" y="205" width="20" height="20" fill="white"/></g>
<g data-p="chimney"><rect x="350" y="160" width="15" height="30" fill="gray"/></g>
</g>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="240" width="400" height="60" fill="gray"/></g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="50" y="190" width="20" height="50" fill="brown"/></g>
      <g data-p="crown"><circle cx="60" cy="170" r="35" fill="green"/></g>
    </g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="150" y="180" width="100" height="60" fill="orange"/></g>
      <g data-p="roof"><polygon points="140,180 260,180 200,140" fill="red"/></g>
      <g data-p="door"><rect x="180" y="200" width="40" height="40" fill="brown"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="330" y="190" width="20" height="50" fill="brown"/></g>
      <g data-p="crown"><circle cx="340" cy="170" r="35" fill="green"/></g>
    </g>
  </g>
</svg>

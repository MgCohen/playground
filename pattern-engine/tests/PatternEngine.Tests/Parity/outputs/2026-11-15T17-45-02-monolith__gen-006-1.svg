<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="240" width="400" height="60" fill="gray"/></g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="22" y="200" width="12" height="40" fill="brown"/></g>
      <g data-p="crown"><circle cx="28" cy="185" r="25" fill="green"/></g>
    </g>
    <g data-p="house" data-v="chimney">
      <g data-p="body"><rect x="70" y="190" width="90" height="50" fill="yellow"/></g>
      <g data-p="roof"><polygon points="65,190 165,190 115,150" fill="red"/></g>
      <g data-p="door"><rect x="107" y="212" width="16" height="28" fill="brown"/></g>
      <g data-p="window"><rect x="80" y="205" width="16" height="16" fill="blue"/></g>
      <g data-p="chimney"><rect x="135" y="140" width="12" height="35" fill="gray"/></g>
    </g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="185" y="200" width="70" height="40" fill="orange"/></g>
      <g data-p="roof"><polygon points="180,200 260,200 220,175" fill="brown"/></g>
      <g data-p="door"><rect x="205" y="212" width="30" height="28" fill="brown"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="312" y="200" width="12" height="40" fill="brown"/></g>
      <g data-p="crown"><circle cx="318" cy="185" r="25" fill="green"/></g>
    </g>
  </g>
</svg>

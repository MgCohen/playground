<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="gray"/></g>
    <g data-p="house" data-v="chimney">
      <g data-p="body"><rect x="10" y="180" width="100" height="70" fill="#f5deb3"/></g>
      <g data-p="roof"><polygon points="5,180 115,180 60,140" fill="red"/></g>
      <g data-p="door"><rect x="50" y="215" width="20" height="35" fill="green"/></g>
      <g data-p="chimney"><rect x="85" y="155" width="12" height="23" fill="brown"/></g>
    </g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="130" y="205" width="60" height="45" fill="#d2b48c"/></g>
      <g data-p="roof"><polygon points="125,205 195,205 160,180" fill="gray"/></g>
      <g data-p="door"><rect x="147" y="220" width="26" height="30" fill="brown"/></g>
    </g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="210" y="205" width="60" height="45" fill="#d2b48c"/></g>
      <g data-p="roof"><polygon points="205,205 275,205 240,180" fill="gray"/></g>
      <g data-p="door"><rect x="227" y="220" width="26" height="30" fill="brown"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="330" y="200" width="12" height="50" fill="brown"/></g>
      <g data-p="crown"><circle cx="336" cy="190" r="28" fill="green"/></g>
    </g>
  </g>
</svg>

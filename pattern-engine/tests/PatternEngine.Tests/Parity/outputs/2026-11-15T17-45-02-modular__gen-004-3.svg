<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="gray"/></g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="25" y="210" width="12" height="40" fill="brown"/></g>
      <g data-p="crown"><circle cx="31" cy="195" r="22" fill="green"/></g>
    </g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="70" y="205" width="70" height="45" fill="orange"/></g>
      <g data-p="roof"><polygon points="65,205 105,180 145,205" fill="brown"/></g>
      <g data-p="door"><rect x="95" y="225" width="30" height="25" fill="blue"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="160" y="190" width="80" height="60" fill="yellow"/></g>
      <g data-p="roof"><polygon points="155,190 200,155 245,190" fill="red"/></g>
      <g data-p="door"><rect x="190" y="220" width="20" height="30" fill="brown"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="290" y="150" width="50" height="100" fill="gray"/></g>
      <g data-p="roof"><polygon points="285,150 315,115 345,150" fill="brown"/></g>
      <g data-p="door"><rect x="305" y="225" width="20" height="25" fill="green"/></g>
    </g>
  </g>
</svg>

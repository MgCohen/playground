<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="240" width="400" height="60" fill="gray"/></g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="40" y="160" width="100" height="80" fill="orange"/></g>
      <g data-p="roof"><polygon points="30,160 150,160 90,110" fill="red"/></g>
      <g data-p="door"><rect x="80" y="200" width="20" height="40" fill="yellow"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="220" y="160" width="100" height="80" fill="orange"/></g>
      <g data-p="roof"><polygon points="210,160 330,160 270,110" fill="red"/></g>
      <g data-p="door"><rect x="260" y="200" width="20" height="40" fill="green"/></g>
    </g>
  </g>
</svg>

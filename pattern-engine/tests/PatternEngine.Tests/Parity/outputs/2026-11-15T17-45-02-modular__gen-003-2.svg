<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="40" fill="gray"/></g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="20" y="130" width="60" height="120" fill="gray"/></g>
      <g data-p="roof"><polygon points="15,130 85,130 50,95" fill="brown"/></g>
      <g data-p="door"><rect x="40" y="215" width="20" height="35" fill="red"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="130" y="190" width="100" height="60" fill="orange"/></g>
      <g data-p="roof"><polygon points="120,190 240,190 180,150" fill="brown"/></g>
      <g data-p="door"><rect x="170" y="215" width="20" height="35" fill="yellow"/></g>
    </g>
    <g data-p="house" data-v="chimney">
      <g data-p="body"><rect x="290" y="190" width="100" height="60" fill="white"/></g>
      <g data-p="roof"><polygon points="280,190 390,190 340,150" fill="brown"/></g>
      <g data-p="door"><rect x="330" y="215" width="20" height="35" fill="brown"/></g>
      <g data-p="chimney"><rect x="360" y="150" width="12" height="30" fill="black"/></g>
    </g>
  </g>
</svg>

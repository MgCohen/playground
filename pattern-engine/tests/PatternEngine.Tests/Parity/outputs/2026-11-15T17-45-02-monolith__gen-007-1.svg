<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="gray"/></g>
    <g data-p="house" data-v="chimney">
      <g data-p="body"><rect x="10" y="190" width="120" height="60" fill="orange"/></g>
      <g data-p="roof"><polygon points="5,190 135,190 70,150" fill="red"/></g>
      <g data-p="door"><rect x="60" y="220" width="20" height="30" fill="green"/></g>
      <g data-p="chimney"><rect x="100" y="155" width="15" height="20" fill="brown"/></g>
    </g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="145" y="215" width="60" height="35" fill="brown"/></g>
      <g data-p="roof"><polygon points="140,215 210,215 175,190" fill="gray"/></g>
      <g data-p="door"><rect x="162" y="228" width="26" height="22" fill="#8b5a2b"/></g>
    </g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="220" y="215" width="60" height="35" fill="brown"/></g>
      <g data-p="roof"><polygon points="215,215 285,215 250,190" fill="gray"/></g>
      <g data-p="door"><rect x="237" y="228" width="26" height="22" fill="#8b5a2b"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="330" y="205" width="20" height="45" fill="brown"/></g>
      <g data-p="crown"><circle cx="340" cy="190" r="30" fill="green"/></g>
    </g>
  </g>
</svg>

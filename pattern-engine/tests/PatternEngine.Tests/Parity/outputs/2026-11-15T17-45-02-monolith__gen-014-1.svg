<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="green"/></g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="20" y="110" width="60" height="140" fill="gray"/></g>
      <g data-p="roof"><polygon points="15,110 85,110 50,70" fill="red"/></g>
      <g data-p="door"><rect x="40" y="220" width="20" height="30" fill="blue"/></g>
      <g data-p="window"><rect x="40" y="130" width="20" height="20" fill="yellow"/></g>
    </g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="130" y="200" width="90" height="50" fill="orange"/></g>
      <g data-p="roof"><polygon points="125,200 225,200 175,170" fill="brown"/></g>
      <g data-p="door"><rect x="160" y="215" width="40" height="35" fill="brown"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="300" y="200" width="16" height="50" fill="brown"/></g>
      <g data-p="crown"><circle cx="308" cy="190" r="30" fill="green"/></g>
    </g>
  </g>
</svg>

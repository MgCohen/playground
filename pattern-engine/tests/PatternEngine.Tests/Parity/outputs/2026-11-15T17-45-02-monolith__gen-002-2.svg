<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="green"/></g>
    <g data-p="house" data-v="chimney">
      <g data-p="body"><rect x="20" y="190" width="100" height="60" fill="orange"/></g>
      <g data-p="roof"><polygon points="10,190 130,190 70,150" fill="red"/></g>
      <g data-p="door"><rect x="60" y="220" width="20" height="30" fill="brown"/></g>
      <g data-p="window"><rect x="28" y="200" width="20" height="20" fill="blue"/></g>
      <g data-p="chimney"><rect x="95" y="160" width="15" height="20" fill="gray"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="160" y="130" width="60" height="120" fill="gray"/></g>
      <g data-p="roof"><polygon points="150,130 230,130 190,90" fill="brown"/></g>
      <g data-p="door"><rect x="181" y="225" width="18" height="25" fill="brown"/></g>
      <g data-p="window"><rect x="182" y="145" width="16" height="15" fill="yellow"/></g>
      <g data-p="window"><rect x="182" y="175" width="16" height="15" fill="yellow"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="300" y="200" width="20" height="50" fill="brown"/></g>
      <g data-p="crown"><circle cx="310" cy="185" r="35" fill="green"/></g>
    </g>
  </g>
</svg>

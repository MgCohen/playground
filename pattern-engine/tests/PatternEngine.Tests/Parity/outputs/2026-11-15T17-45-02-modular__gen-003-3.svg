<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<g data-p="street" data-v="row">
<g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="green"/></g>
<g data-p="tower" data-v="plain">
<g data-p="body"><rect x="20" y="150" width="60" height="100" fill="gray"/></g>
<g data-p="roof"><polygon points="15,150 85,150 50,110" fill="brown"/></g>
<g data-p="door"><rect x="40" y="225" width="20" height="25" fill="red"/></g>
</g>
<g data-p="house" data-v="plain">
<g data-p="body"><rect x="110" y="180" width="100" height="70" fill="orange"/></g>
<g data-p="roof"><polygon points="105,180 215,180 160,130" fill="brown"/></g>
<g data-p="door"><rect x="150" y="215" width="20" height="35" fill="yellow"/></g>
</g>
<g data-p="house" data-v="chimney">
<g data-p="body"><rect x="250" y="180" width="130" height="70" fill="orange"/></g>
<g data-p="roof"><polygon points="245,180 385,180 315,125" fill="brown"/></g>
<g data-p="door"><rect x="305" y="215" width="20" height="35" fill="brown"/></g>
<g data-p="chimney"><rect x="345" y="145" width="15" height="30" fill="gray"/></g>
</g>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="260" width="400" height="40" fill="green"/></g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="40" y="200" width="10" height="60" fill="brown"/></g>
      <g data-p="crown"><circle cx="45" cy="185" r="25" fill="green"/></g>
    </g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="100" y="200" width="100" height="60" fill="orange"/></g>
      <g data-p="roof"><polygon points="95,200 205,200 150,160" fill="red"/></g>
      <g data-p="door"><rect x="130" y="220" width="40" height="40" fill="blue"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="220" y="190" width="120" height="70" fill="yellow"/></g>
      <g data-p="roof"><polygon points="215,190 345,190 280,140" fill="red"/></g>
      <g data-p="door"><rect x="268" y="224" width="24" height="36" fill="brown"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="350" y="160" width="40" height="100" fill="gray"/></g>
      <g data-p="roof"><polygon points="348,160 392,160 370,125" fill="red"/></g>
      <g data-p="door"><rect x="363" y="236" width="14" height="24" fill="green"/></g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="40" fill="gray"/></g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="30" y="215" width="12" height="35" fill="brown"/></g>
      <g data-p="crown"><circle cx="36" cy="200" r="22" fill="green"/></g>
    </g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="80" y="215" width="60" height="35" fill="orange"/></g>
      <g data-p="roof"><polygon points="75,215 145,215 110,190" fill="red"/></g>
      <g data-p="door"><rect x="97" y="230" width="26" height="20" fill="yellow"/></g>
    </g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="160" y="215" width="60" height="35" fill="orange"/></g>
      <g data-p="roof"><polygon points="155,215 225,215 190,190" fill="red"/></g>
      <g data-p="door"><rect x="177" y="230" width="26" height="20" fill="brown"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="255" y="150" width="40" height="100" fill="gray"/></g>
      <g data-p="roof"><polygon points="250,150 300,150 275,120" fill="red"/></g>
      <g data-p="door"><rect x="267" y="230" width="16" height="20" fill="blue"/></g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<g data-p="street" data-v="row">
<g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="gray"/></g>
<g data-p="tree" data-v="plain">
<g data-p="trunk"><rect x="45" y="200" width="20" height="50" fill="brown"/></g>
<g data-p="crown"><circle cx="55" cy="185" r="35" fill="green"/></g>
</g>
<g data-p="tower" data-v="plain">
<g data-p="body"><rect x="140" y="120" width="50" height="130" fill="gray"/></g>
<g data-p="roof"><polygon points="130,120 200,120 165,80" fill="brown"/></g>
<g data-p="door"><rect x="155" y="220" width="20" height="30" fill="brown"/></g>
<g data-p="window"><rect x="158" y="150" width="14" height="14" fill="yellow"/></g>
</g>
<g data-p="house" data-v="plain">
<g data-p="body"><rect x="240" y="190" width="120" height="60" fill="orange"/></g>
<g data-p="roof"><polygon points="230,190 370,190 300,150" fill="brown"/></g>
<g data-p="door"><rect x="290" y="220" width="24" height="30" fill="red"/></g>
<g data-p="window"><rect x="330" y="205" width="20" height="20" fill="yellow"/></g>
</g>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="gray"/></g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="20" y="100" width="60" height="150" fill="orange"/></g>
      <g data-p="roof"><polygon points="15,100 85,100 50,60" fill="red"/></g>
      <g data-p="door"><rect x="40" y="215" width="20" height="35" fill="green"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="145" y="200" width="10" height="50" fill="brown"/></g>
      <g data-p="crown"><circle cx="150" cy="190" r="25" fill="green"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="245" y="200" width="10" height="50" fill="brown"/></g>
      <g data-p="crown"><circle cx="250" cy="190" r="25" fill="green"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="345" y="200" width="10" height="50" fill="brown"/></g>
      <g data-p="crown"><circle cx="350" cy="190" r="25" fill="green"/></g>
    </g>
  </g>
</svg>

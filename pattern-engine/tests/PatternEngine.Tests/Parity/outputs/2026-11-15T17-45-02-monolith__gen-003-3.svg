<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<g data-p="street" data-v="row">
<g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="green"/></g>
<g data-p="tower" data-v="plain">
<g data-p="body"><rect x="20" y="160" width="40" height="90" fill="gray"/></g>
<g data-p="roof"><polygon points="15,160 65,160 40,125" fill="brown"/></g>
<g data-p="door"><rect x="33" y="225" width="14" height="25" fill="red"/></g>
<g data-p="window"><rect x="33" y="175" width="14" height="14" fill="white"/></g>
</g>
<g data-p="house" data-v="plain">

<g data-p="roof"><polygon points="225,190 315,190 270,150" fill="brown"/></g>
<g data-p="door"><rect x="260" y="220" width="20" height="30" fill="brown"/></g>
<g data-p="window"><rect x="288" y="203" width="14" height="14" fill="white"/></g>
<g data-p="chimney"><rect x="285" y="155" width="12" height="25" fill="gray"/></g>
</g>
</g>
</svg>

<g data-p="roof"><polygon points="95,190 185,190 140,150" fill="brown"/></g>
<g data-p="door"><rect x="130" y="220" width="20" height="30" fill="yellow"/></g>
<g data-p="window"><rect x="108" y="203" width="14" height="14" fill="white"/></g>
</g>
<g data-p="house" data-v="chimney">

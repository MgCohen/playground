    <g data-p="roof"><polygon points="90,150 200,70 310,150" fill="red"/></g>
    <g data-p="door"><rect x="180" y="200" width="40" height="70" fill="brown"/></g>
    <g data-p="window"><rect x="120" y="175" width="40" height="40" fill="blue"/></g>
    <g data-p="window"><rect x="240" y="175" width="40" height="40" fill="blue"/></g>
    <g data-p="chimney"><rect x="240" y="80" width="24" height="50" fill="gray"/></g>

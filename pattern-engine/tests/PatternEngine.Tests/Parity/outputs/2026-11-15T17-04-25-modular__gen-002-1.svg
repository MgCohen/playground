<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground">
      <rect x="0" y="260" width="400" height="40" fill="green"/>
    </g>
    <g data-p="house" data-v="chimney">
      <g data-p="body">
        <rect x="20" y="190" width="100" height="70" fill="yellow"/>
      </g>
      <g data-p="roof">
        <polygon points="15,190 125,190 70,140" fill="red"/>
      </g>
      <g data-p="door">
        <rect x="55" y="215" width="20" height="45" fill="brown"/>
      </g>
      <g data-p="chimney">
        <rect x="90" y="125" width="14" height="30" fill="gray"/>
      </g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body">
        <rect x="170" y="140" width="40" height="120" fill="gray"/>
      </g>
      <g data-p="roof">
        <polygon points="165,140 215,140 190,100" fill="red"/>
      </g>
      <g data-p="door">
        <rect x="182" y="225" width="16" height="35" fill="brown"/>
      </g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk">
        <rect x="300" y="220" width="12" height="40" fill="brown"/>
      </g>
      <g data-p="crown">
        <circle cx="306" cy="200" r="28" fill="green"/>
      </g>
    </g>
  </g>
</svg>

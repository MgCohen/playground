<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="gray"/></g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="30" y="210" width="14" height="40" fill="brown"/></g>
      <g data-p="crown"><circle cx="37" cy="200" r="25" fill="green"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="100" y="210" width="14" height="40" fill="brown"/></g>
      <g data-p="crown"><circle cx="107" cy="200" r="25" fill="green"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="160" y="150" width="40" height="100" fill="#cccccc"/></g>
      <g data-p="roof"><polygon points="155,150 205,150 180,110" fill="red"/></g>
      <g data-p="door"><rect x="172" y="225" width="16" height="25" fill="yellow"/></g>
      <g data-p="window"><rect x="174" y="165" width="12" height="15" fill="blue"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="250" y="180" width="100" height="70" fill="orange"/></g>
      <g data-p="roof"><polygon points="245,180 355,180 300,140" fill="brown"/></g>
      <g data-p="door"><rect x="290" y="215" width="20" height="35" fill="brown"/></g>
      <g data-p="window"><rect x="264" y="195" width="16" height="16" fill="blue"/></g>
    </g>
  </g>
</svg>

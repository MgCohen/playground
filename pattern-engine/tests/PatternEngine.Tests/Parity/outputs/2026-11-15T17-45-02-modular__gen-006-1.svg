<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="gray"/></g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="25" y="215" width="10" height="35" fill="brown"/></g>
      <g data-p="crown"><circle cx="30" cy="205" r="22" fill="green"/></g>
    </g>
    <g data-p="house" data-v="chimney">
      <g data-p="body"><rect x="70" y="190" width="120" height="60" fill="yellow"/></g>
      <g data-p="roof"><polygon points="62,190 130,150 198,190" fill="red"/></g>
      <g data-p="door"><rect x="120" y="215" width="20" height="35" fill="brown"/></g>
      <g data-p="chimney"><rect x="160" y="158" width="14" height="25" fill="gray"/></g>
    </g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="215" y="200" width="70" height="50" fill="orange"/></g>
      <g data-p="roof"><polygon points="210,200 250,175 290,200" fill="brown"/></g>
      <g data-p="door"><rect x="235" y="215" width="30" height="35" fill="brown"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="335" y="215" width="10" height="35" fill="brown"/></g>
      <g data-p="crown"><circle cx="340" cy="205" r="22" fill="green"/></g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="green"/></g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="20" y="215" width="12" height="35" fill="brown"/></g>
      <g data-p="crown"><circle cx="26" cy="200" r="22" fill="green"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="70" y="215" width="12" height="35" fill="brown"/></g>
      <g data-p="crown"><circle cx="76" cy="200" r="22" fill="green"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="130" y="150" width="50" height="100" fill="gray"/></g>
      <g data-p="roof"><polygon points="125,150 185,150 155,110" fill="red"/></g>
      <g data-p="door"><rect x="148" y="220" width="14" height="30" fill="yellow"/></g>
      <g data-p="window"><rect x="148" y="165" width="14" height="14" fill="blue"/></g>
      <g data-p="window"><rect x="148" y="190" width="14" height="14" fill="blue"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="230" y="170" width="130" height="80" fill="orange"/></g>
      <g data-p="roof"><polygon points="225,170 365,170 295,120" fill="red"/></g>
      <g data-p="door"><rect x="285" y="215" width="20" height="35" fill="brown"/></g>
      <g data-p="window"><rect x="245" y="190" width="25" height="25" fill="blue"/></g>
    </g>
  </g>
</svg>

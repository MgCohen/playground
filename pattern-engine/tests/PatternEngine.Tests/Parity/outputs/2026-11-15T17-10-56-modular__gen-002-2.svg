<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="240" width="400" height="60" fill="green"/></g>
    <g data-p="house" data-v="chimney">
      <g data-p="body"><rect x="20" y="170" width="100" height="70" fill="white"/></g>
      <g data-p="roof"><polygon points="15,170 125,170 70,130" fill="red"/></g>
      <g data-p="door"><rect x="55" y="200" width="20" height="40" fill="brown"/></g>
      <g data-p="chimney"><rect x="95" y="135" width="12" height="30" fill="gray"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="160" y="150" width="50" height="90" fill="gray"/></g>
      <g data-p="roof"><polygon points="155,150 215,150 185,110" fill="black"/></g>
      <g data-p="door"><rect x="177" y="200" width="16" height="40" fill="brown"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="250" y="200" width="12" height="40" fill="brown"/></g>
      <g data-p="crown"><circle cx="256" cy="185" r="25" fill="green"/></g>
    </g>
  </g>
</svg>

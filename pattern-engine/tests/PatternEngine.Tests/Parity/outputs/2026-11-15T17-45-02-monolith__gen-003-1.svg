<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<g data-p="street" data-v="row">
<g data-p="ground"><rect x="0" y="250" width="400" height="40" fill="green"/></g>
<g data-p="tower" data-v="plain">
<g data-p="body"><rect x="20" y="150" width="60" height="100" fill="gray"/></g>
<g data-p="roof"><polygon points="15,150 85,150 50,110" fill="brown"/></g>
<g data-p="door"><rect x="42" y="225" width="16" height="25" fill="red"/></g>
<g data-p="window"><rect x="45" y="165" width="10" height="15" fill="white"/></g>
</g>
<g data-p="house" data-v="plain">
<g data-p="body"><rect x="120" y="190" width="80" height="60" fill="orange"/></g>
<g data-p="roof"><polygon points="115,190 205,190 160,150" fill="brown"/></g>
<g data-p="door"><rect x="152" y="220" width="16" height="30" fill="yellow"/></g>
<g data-p="window"><rect x="130" y="205" width="14" height="14" fill="white"/></g>
</g>
<g data-p="house" data-v="chimney">
<g data-p="body"><rect x="250" y="190" width="90" height="60" fill="orange"/></g>
<g data-p="roof"><polygon points="245,190 345,190 295,150" fill="brown"/></g>
<g data-p="door"><rect x="287" y="220" width="16" height="30" fill="brown"/></g>
<g data-p="window"><rect x="260" y="205" width="14" height="14" fill="white"/></g>
<g data-p="chimney"><rect x="315" y="135" width="10" height="35" fill="gray"/></g>
</g>
</g>
</svg>

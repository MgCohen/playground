<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="260" width="400" height="40" fill="green"/></g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="30" y="200" width="10" height="60" fill="brown"/></g>
      <g data-p="crown"><circle cx="35" cy="185" r="25" fill="green"/></g>
    </g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="80" y="210" width="70" height="50" fill="orange"/></g>
      <g data-p="roof"><polygon points="75,210 155,210 115,180" fill="gray"/></g>
      <g data-p="door"><rect x="101" y="230" width="28" height="30" fill="blue"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="180" y="200" width="90" height="60" fill="white"/></g>
      <g data-p="roof"><polygon points="172,200 278,200 225,160" fill="red"/></g>
      <g data-p="door"><rect x="214" y="226" width="22" height="34" fill="brown"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="300" y="170" width="40" height="90" fill="gray"/></g>
      <g data-p="roof"><polygon points="292,170 348,170 320,130" fill="black"/></g>
      <g data-p="door"><rect x="308" y="230" width="24" height="30" fill="green"/></g>
    </g>
  </g>
</svg>

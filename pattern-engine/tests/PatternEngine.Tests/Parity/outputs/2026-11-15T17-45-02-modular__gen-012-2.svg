<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="gray"/></g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="40" y="170" width="130" height="80" fill="orange"/></g>
      <g data-p="roof"><polygon points="30,170 105,120 180,170" fill="brown"/></g>
      <g data-p="door"><rect x="90" y="205" width="30" height="45" fill="yellow"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="220" y="170" width="130" height="80" fill="orange"/></g>
      <g data-p="roof"><polygon points="210,170 285,120 360,170" fill="brown"/></g>
      <g data-p="door"><rect x="270" y="205" width="30" height="45" fill="green"/></g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="240" width="400" height="50" fill="gray"/></g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="50" y="190" width="20" height="50" fill="brown"/></g>
      <g data-p="crown"><circle cx="60" cy="170" r="40" fill="green"/></g>
    </g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="150" y="190" width="100" height="50" fill="orange"/></g>
      <g data-p="roof"><polygon points="140,190 260,190 200,150" fill="red"/></g>
      <g data-p="door"><rect x="178" y="210" width="44" height="30" fill="brown"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="330" y="190" width="20" height="50" fill="brown"/></g>
      <g data-p="crown"><circle cx="340" cy="170" r="40" fill="green"/></g>
    </g>
  </g>
</svg>

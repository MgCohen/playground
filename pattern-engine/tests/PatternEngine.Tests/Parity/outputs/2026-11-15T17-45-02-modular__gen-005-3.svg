<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="green"/></g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="20" y="190" width="100" height="60" fill="yellow"/></g>
      <g data-p="roof"><polygon points="10,190 130,190 70,140" fill="red"/></g>
      <g data-p="door"><rect x="60" y="215" width="20" height="35" fill="brown"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="160" y="130" width="50" height="120" fill="gray"/></g>
      <g data-p="roof"><polygon points="155,130 215,130 185,95" fill="red"/></g>
      <g data-p="door"><rect x="175" y="220" width="20" height="30" fill="brown"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="270" y="130" width="50" height="120" fill="gray"/></g>
      <g data-p="roof"><polygon points="265,130 325,130 295,95" fill="red"/></g>
      <g data-p="door"><rect x="285" y="220" width="20" height="30" fill="brown"/></g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="green"/></g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="20" y="190" width="100" height="60" fill="orange"/></g>
      <g data-p="roof"><polygon points="10,190 130,190 70,150" fill="red"/></g>
      <g data-p="door"><rect x="60" y="220" width="20" height="30" fill="brown"/></g>
      <g data-p="window"><rect x="30" y="205" width="20" height="15" fill="blue"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="160" y="150" width="40" height="100" fill="gray"/></g>
      <g data-p="roof"><polygon points="155,150 205,150 180,120" fill="red"/></g>
      <g data-p="door"><rect x="172" y="230" width="16" height="20" fill="brown"/></g>
      <g data-p="window"><rect x="172" y="165" width="16" height="20" fill="blue"/></g>
      <g data-p="window"><rect x="172" y="195" width="16" height="20" fill="blue"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="260" y="150" width="40" height="100" fill="gray"/></g>
      <g data-p="roof"><polygon points="255,150 305,150 280,120" fill="red"/></g>
      <g data-p="door"><rect x="272" y="230" width="16" height="20" fill="brown"/></g>
      <g data-p="window"><rect x="272" y="165" width="16" height="20" fill="blue"/></g>
      <g data-p="window"><rect x="272" y="195" width="16" height="20" fill="blue"/></g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="gray"/></g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="60" y="100" width="60" height="150" fill="gray"/></g>
      <g data-p="roof"><polygon points="50,100 130,100 90,60" fill="red"/></g>
      <g data-p="door"><rect x="80" y="225" width="20" height="25" fill="brown"/></g>
      <g data-p="window"><rect x="82" y="120" width="16" height="16" fill="yellow"/></g>
      <g data-p="window"><rect x="82" y="150" width="16" height="16" fill="yellow"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="260" y="100" width="60" height="150" fill="gray"/></g>
      <g data-p="roof"><polygon points="250,100 330,100 290,60" fill="red"/></g>
      <g data-p="door"><rect x="280" y="225" width="20" height="25" fill="brown"/></g>
      <g data-p="window"><rect x="282" y="120" width="16" height="16" fill="yellow"/></g>
      <g data-p="window"><rect x="282" y="150" width="16" height="16" fill="yellow"/></g>
    </g>
  </g>
</svg>

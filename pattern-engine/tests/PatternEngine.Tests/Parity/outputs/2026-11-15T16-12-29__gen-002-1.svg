<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<g data-p="street" data-v="row">
<g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="gray"/></g>
<g data-p="house" data-v="chimney">
<g data-p="body"><rect x="20" y="190" width="100" height="60" fill="orange"/></g>
<g data-p="roof"><polygon points="10,190 130,190 70,140" fill="red"/></g>
<g data-p="chimney"><rect x="95" y="150" width="14" height="40" fill="brown"/></g>
<g data-p="door"><rect x="60" y="220" width="20" height="30" fill="brown"/></g>
<g data-p="window"><rect x="30" y="205" width="20" height="20" fill="yellow"/></g>
</g>
<g data-p="house" data-v="plain">
<g data-p="body"><rect x="150" y="190" width="100" height="60" fill="yellow"/></g>
<g data-p="roof"><polygon points="140,190 260,190 200,140" fill="brown"/></g>
<g data-p="door"><rect x="190" y="220" width="20" height="30" fill="brown"/></g>
<g data-p="window"><rect x="160" y="205" width="20" height="20" fill="white"/></g>
</g>
<g data-p="tower" data-v="plain">
<g data-p="body"><rect x="290" y="130" width="60" height="120" fill="gray"/></g>
<g data-p="roof"><polygon points="280,130 360,130 320,80" fill="blue"/></g>
<g data-p="door"><rect x="310" y="215" width="20" height="35" fill="green"/></g>
<g data-p="window"><rect x="310" y="150" width="20" height="20" fill="white"/></g>
</g>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="240" width="400" height="60" fill="gray"/></g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="30" y="190" width="100" height="50" fill="brown"/></g>
      <g data-p="roof"><polygon points="20,190 80,150 140,190" fill="gray"/></g>
      <g data-p="door"><rect x="60" y="205" width="40" height="35" fill="brown"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="220" y="170" width="130" height="70" fill="orange"/></g>
      <g data-p="roof"><polygon points="210,170 285,120 360,170" fill="red"/></g>
      <g data-p="door"><rect x="272" y="200" width="26" height="40" fill="yellow"/></g>
    </g>
  </g>
</svg>

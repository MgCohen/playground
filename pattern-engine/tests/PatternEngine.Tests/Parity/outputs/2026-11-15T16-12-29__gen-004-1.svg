<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="gray"/></g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="40" y="180" width="100" height="70" fill="orange"/></g>
      <g data-p="roof"><polygon points="30,180 150,180 90,130" fill="red"/></g>
      <g data-p="door"><rect x="80" y="220" width="20" height="30" fill="brown"/></g>
      <g data-p="window"><rect x="50" y="195" width="20" height="20" fill="blue"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="270" y="200" width="20" height="50" fill="brown"/></g>
      <g data-p="crown"><circle cx="280" cy="180" r="35" fill="green"/></g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="green"/></g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="40" y="130" width="50" height="120" fill="gray"/></g>
      <g data-p="roof"><polygon points="35,130 95,130 65,90" fill="brown"/></g>
      <g data-p="door"><rect x="58" y="220" width="14" height="30" fill="brown"/></g>
      <g data-p="window"><rect x="58" y="150" width="14" height="14" fill="white"/></g>
      <g data-p="window"><rect x="58" y="180" width="14" height="14" fill="white"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="140" y="190" width="100" height="60" fill="orange"/></g>
      <g data-p="roof"><polygon points="130,190 250,190 190,150" fill="red"/></g>
      <g data-p="door"><rect x="180" y="220" width="20" height="30" fill="yellow"/></g>
      <g data-p="window"><rect x="150" y="205" width="20" height="20" fill="white"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="310" y="200" width="16" height="50" fill="brown"/></g>
      <g data-p="crown"><circle cx="318" cy="190" r="30" fill="green"/></g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="260" width="400" height="40" fill="gray"/></g>
    <g data-p="house" data-v="chimney">
      <g data-p="body"><rect x="20" y="180" width="120" height="80" fill="orange"/></g>
      <g data-p="roof"><polygon points="10,180 150,180 80,110" fill="red"/></g>
      <g data-p="door"><rect x="60" y="220" width="20" height="40" fill="brown"/></g>
      <g data-p="chimney"><rect x="100" y="120" width="16" height="30" fill="gray"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="200" y="140" width="40" height="120" fill="gray"/></g>
      <g data-p="roof"><polygon points="195,140 245,140 220,110" fill="black"/></g>
      <g data-p="door"><rect x="213" y="220" width="14" height="40" fill="brown"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="294" y="200" width="12" height="60" fill="brown"/></g>
      <g data-p="crown"><circle cx="300" cy="185" r="28" fill="green"/></g>
    </g>
  </g>
</svg>

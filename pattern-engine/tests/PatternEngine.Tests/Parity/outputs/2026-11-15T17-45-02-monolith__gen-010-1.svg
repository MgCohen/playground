<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="240" width="400" height="60" fill="green"/></g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="30" y="180" width="100" height="60" fill="gray"/></g>
      <g data-p="roof"><polygon points="20,180 80,150 140,180" fill="brown"/></g>
      <g data-p="door"><rect x="55" y="200" width="50" height="40" fill="brown"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="200" y="160" width="140" height="80" fill="orange"/></g>
      <g data-p="roof"><polygon points="190,160 270,110 350,160" fill="red"/></g>
      <g data-p="door"><rect x="258" y="195" width="24" height="45" fill="yellow"/></g>
      <g data-p="window"><rect x="215" y="180" width="30" height="25" fill="blue"/></g>
    </g>
  </g>
</svg>

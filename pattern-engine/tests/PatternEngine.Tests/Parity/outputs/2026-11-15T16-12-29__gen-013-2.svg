<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="green"/></g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="40" y="110" width="60" height="140" fill="gray"/></g>
      <g data-p="roof"><polygon points="35,110 105,110 70,60" fill="brown"/></g>
      <g data-p="door"><rect x="60" y="220" width="20" height="30" fill="brown"/></g>
      <g data-p="window"><rect x="62" y="130" width="16" height="16" fill="yellow"/></g>
      <g data-p="window"><rect x="62" y="165" width="16" height="16" fill="yellow"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="180" y="170" width="120" height="80" fill="orange"/></g>
      <g data-p="roof"><polygon points="170,170 310,170 240,120" fill="brown"/></g>
      <g data-p="door"><rect x="228" y="210" width="24" height="40" fill="red"/></g>
      <g data-p="window"><rect x="195" y="190" width="24" height="24" fill="yellow"/></g>
    </g>
  </g>
</svg>

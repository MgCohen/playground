<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="green"/></g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="40" y="110" width="50" height="140" fill="gray"/></g>
      <g data-p="roof"><polygon points="35,110 95,110 65,80" fill="brown"/></g>
      <g data-p="door"><rect x="57" y="222" width="16" height="28" fill="brown"/></g>
      <g data-p="window"><rect x="57" y="130" width="16" height="16" fill="yellow"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="180" y="170" width="140" height="80" fill="orange"/></g>
      <g data-p="roof"><polygon points="170,170 330,170 250,120" fill="gray"/></g>
      <g data-p="door"><rect x="240" y="215" width="20" height="35" fill="red"/></g>
      <g data-p="window"><rect x="195" y="190" width="16" height="16" fill="yellow"/></g>
    </g>
  </g>
</svg>

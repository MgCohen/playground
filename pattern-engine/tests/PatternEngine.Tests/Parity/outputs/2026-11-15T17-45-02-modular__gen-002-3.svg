<g data-p="door"><rect x="60" y="215" width="20" height="35" fill="brown"/></g>
<g data-p="window"><rect x="30" y="203" width="20" height="20" fill="blue"/></g>
<g data-p="chimney"><rect x="95" y="155" width="15" height="25" fill="gray"/></g>
</g>
<g data-p="tower" data-v="plain">

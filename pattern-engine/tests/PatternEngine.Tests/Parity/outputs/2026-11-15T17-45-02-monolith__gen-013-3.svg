<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="green"/></g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="20" y="210" width="12" height="40" fill="brown"/></g>
      <g data-p="crown"><circle cx="26" cy="200" r="22" fill="green"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="70" y="210" width="12" height="40" fill="brown"/></g>
      <g data-p="crown"><circle cx="76" cy="200" r="22" fill="green"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="120" y="150" width="40" height="100" fill="gray"/></g>
      <g data-p="roof"><polygon points="116,150 164,150 140,115" fill="red"/></g>
      <g data-p="door"><rect x="132" y="224" width="16" height="26" fill="yellow"/></g>
      <g data-p="window"><rect x="134" y="165" width="12" height="15" fill="white"/></g>
      <g data-p="window"><rect x="134" y="190" width="12" height="15" fill="white"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="190" y="180" width="140" height="70" fill="orange"/></g>
      <g data-p="roof"><polygon points="185,180 335,180 260,130" fill="red"/></g>
      <g data-p="door"><rect x="250" y="215" width="20" height="35" fill="brown"/></g>
      <g data-p="window"><rect x="205" y="195" width="20" height="20" fill="white"/></g>
      <g data-p="window"><rect x="295" y="195" width="20" height="20" fill="white"/></g>
    </g>
  </g>
</svg>

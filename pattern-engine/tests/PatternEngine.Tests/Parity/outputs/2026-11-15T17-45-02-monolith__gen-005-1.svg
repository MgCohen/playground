<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="240" width="400" height="60" fill="green"/></g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="20" y="180" width="100" height="60" fill="yellow"/></g>
      <g data-p="roof"><polygon points="10,180 130,180 70,140" fill="red"/></g>
      <g data-p="door"><rect x="60" y="210" width="20" height="30" fill="brown"/></g>
      <g data-p="window"><rect x="30" y="195" width="20" height="20" fill="blue"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="160" y="150" width="40" height="90" fill="gray"/></g>
      <g data-p="roof"><polygon points="150,150 210,150 180,110" fill="red"/></g>
      <g data-p="door"><rect x="172" y="222" width="16" height="18" fill="brown"/></g>
      <g data-p="window"><rect x="172" y="162" width="16" height="14" fill="blue"/></g>
      <g data-p="window"><rect x="172" y="190" width="16" height="14" fill="blue"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="260" y="150" width="40" height="90" fill="gray"/></g>
      <g data-p="roof"><polygon points="250,150 310,150 280,110" fill="red"/></g>
      <g data-p="door"><rect x="272" y="222" width="16" height="18" fill="brown"/></g>
      <g data-p="window"><rect x="272" y="162" width="16" height="14" fill="blue"/></g>
      <g data-p="window"><rect x="272" y="190" width="16" height="14" fill="blue"/></g>
    </g>
  </g>
</svg>

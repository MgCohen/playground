<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="240" width="400" height="60" fill="green"/></g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="20" y="120" width="60" height="120" fill="gray"/></g>
      <g data-p="roof"><polygon points="15,120 85,120 50,70" fill="red"/></g>
      <g data-p="door"><rect x="42" y="210" width="16" height="30" fill="blue"/></g>
      <g data-p="window"><rect x="42" y="140" width="16" height="16" fill="yellow"/></g>
      <g data-p="window"><rect x="42" y="170" width="16" height="16" fill="yellow"/></g>
    </g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="120" y="180" width="100" height="60" fill="orange"/></g>
      <g data-p="roof"><polygon points="115,180 225,180 170,150" fill="brown"/></g>
      <g data-p="door"><rect x="150" y="200" width="40" height="40" fill="brown"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="300" y="190" width="16" height="50" fill="brown"/></g>
      <g data-p="crown"><circle cx="308" cy="170" r="30" fill="green"/></g>
    </g>
  </g>
</svg>

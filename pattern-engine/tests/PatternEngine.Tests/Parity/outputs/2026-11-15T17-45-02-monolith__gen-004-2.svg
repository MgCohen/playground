<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="40" fill="gray"/></g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="30" y="210" width="14" height="40" fill="brown"/></g>
      <g data-p="crown"><circle cx="37" cy="195" r="25" fill="green"/></g>
    </g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="80" y="210" width="60" height="40" fill="orange"/></g>
      <g data-p="roof"><polygon points="75,210 145,210 110,185" fill="brown"/></g>
      <g data-p="door"><rect x="97" y="225" width="26" height="25" fill="blue"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="160" y="200" width="80" height="50" fill="yellow"/></g>
      <g data-p="roof"><polygon points="155,200 245,200 200,170" fill="red"/></g>
      <g data-p="door"><rect x="190" y="220" width="20" height="30" fill="brown"/></g>
      <g data-p="window"><rect x="170" y="215" width="15" height="15" fill="white"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="280" y="150" width="40" height="100" fill="gray"/></g>
      <g data-p="roof"><polygon points="275,150 325,150 300,120" fill="black"/></g>
      <g data-p="door"><rect x="292" y="228" width="16" height="22" fill="green"/></g>
      <g data-p="window"><rect x="294" y="165" width="12" height="15" fill="white"/></g>
      <g data-p="window"><rect x="294" y="195" width="12" height="15" fill="white"/></g>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="240" width="400" height="60" fill="gray"/></g>
    <g data-p="shed" data-v="plain">
      <g data-p="body"><rect x="20" y="180" width="100" height="60" fill="orange"/></g>
      <g data-p="roof"><polygon points="10,180 130,180 70,140" fill="black"/></g>
      <g data-p="door"><rect x="45" y="200" width="50" height="40" fill="brown"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="200" y="170" width="140" height="70" fill="white"/></g>
      <g data-p="roof"><polygon points="190,170 350,170 270,120" fill="red"/></g>
      <g data-p="door"><rect x="258" y="200" width="24" height="40" fill="yellow"/></g>
    </g>
  </g>
</svg>

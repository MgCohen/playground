<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="green"/></g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="40" y="210" width="20" height="40" fill="brown"/></g>
      <g data-p="crown"><circle cx="50" cy="200" r="30" fill="green"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="130" y="210" width="20" height="40" fill="brown"/></g>
      <g data-p="crown"><circle cx="140" cy="200" r="30" fill="green"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="250" y="100" width="60" height="150" fill="gray"/></g>
      <g data-p="roof"><polygon points="240,100 320,100 280,50" fill="red"/></g>
      <g data-p="door"><rect x="272" y="220" width="16" height="30" fill="brown"/></g>
      <g data-p="window"><rect x="270" y="120" width="20" height="20" fill="yellow"/></g>
      <g data-p="window"><rect x="270" y="160" width="20" height="20" fill="yellow"/></g>
    </g>
  </g>
</svg>

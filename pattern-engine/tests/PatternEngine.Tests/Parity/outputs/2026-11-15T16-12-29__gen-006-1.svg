<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="green"/></g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="45" y="210" width="10" height="40" fill="brown"/></g>
      <g data-p="crown"><circle cx="50" cy="195" r="30" fill="green"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="110" y="190" width="80" height="60" fill="#ddccaa"/></g>
      <g data-p="roof"><polygon points="100,190 200,190 150,150" fill="red"/></g>
      <g data-p="door"><rect x="140" y="220" width="20" height="30" fill="yellow"/></g>
      <g data-p="window"><rect x="118" y="200" width="16" height="16" fill="blue"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="215" y="190" width="70" height="60" fill="#ccddee"/></g>
      <g data-p="roof"><polygon points="205,190 295,190 250,150" fill="gray"/></g>
      <g data-p="door"><rect x="242" y="220" width="16" height="30" fill="brown"/></g>
      <g data-p="window"><rect x="222" y="200" width="14" height="14" fill="blue"/></g>
    </g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="320" y="150" width="50" height="100" fill="gray"/></g>
      <g data-p="roof"><polygon points="315,150 375,150 345,115" fill="red"/></g>
      <g data-p="door"><rect x="337" y="220" width="16" height="30" fill="brown"/></g>
      <g data-p="window"><rect x="337" y="165" width="16" height="20" fill="blue"/></g>
    </g>
  </g>
</svg>

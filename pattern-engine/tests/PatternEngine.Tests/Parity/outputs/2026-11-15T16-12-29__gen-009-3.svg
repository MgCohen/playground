<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <g data-p="street" data-v="row">
    <g data-p="ground"><rect x="0" y="250" width="400" height="50" fill="green"/></g>
    <g data-p="tower" data-v="plain">
      <g data-p="body"><rect x="20" y="130" width="60" height="120" fill="gray"/></g>
      <g data-p="roof"><polygon points="15,130 85,130 50,90" fill="red"/></g>
      <g data-p="door"><rect x="40" y="220" width="20" height="30" fill="brown"/></g>
      <g data-p="window"><rect x="45" y="145" width="10" height="15" fill="blue"/></g>
      <g data-p="window"><rect x="45" y="180" width="10" height="15" fill="blue"/></g>
    </g>
    <g data-p="house" data-v="plain">
      <g data-p="body"><rect x="130" y="180" width="120" height="70" fill="orange"/></g>
      <g data-p="roof"><polygon points="125,180 255,180 190,140" fill="brown"/></g>
      <g data-p="door"><rect x="180" y="215" width="20" height="35" fill="yellow"/></g>
      <g data-p="window"><rect x="140" y="195" width="20" height="17" fill="blue"/></g>
    </g>
    <g data-p="tree" data-v="plain">
      <g data-p="trunk"><rect x="320" y="210" width="20" height="40" fill="brown"/></g>
      <g data-p="crown"><circle cx="330" cy="195" r="30" fill="green"/></g>
    </g>
  </g>
</svg>

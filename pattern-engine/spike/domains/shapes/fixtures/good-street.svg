<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
<g data-p="street" data-v="row">
  <g data-p="ground"><rect x="0" y="260" width="400" height="40" fill="green"/></g>
  <g data-p="house" data-v="plain">
    <g data-p="body"><rect x="30" y="180" width="140" height="80" fill="white"/></g>
    <g data-p="roof"><polygon points="20,180 100,120 180,180" fill="gray"/></g>
    <g data-p="door"><rect x="85" y="215" width="30" height="45" fill="brown"/></g>
  </g>
  <g data-p="tower" data-v="plain">
    <g data-p="body"><rect x="230" y="100" width="60" height="160" fill="white"/></g>
    <g data-p="roof"><polygon points="225,100 260,50 295,100" fill="gray"/></g>
    <g data-p="door"><rect x="248" y="225" width="24" height="35" fill="blue"/></g>
    <g data-p="window"><rect x="250" y="120" width="20" height="25" fill="yellow"/></g>
  </g>
  <g data-p="tree" data-v="plain">
    <g data-p="trunk"><rect x="330" y="210" width="16" height="50" fill="brown"/></g>
    <g data-p="crown"><circle cx="338" cy="190" r="30" fill="green"/></g>
  </g>
</g>
</svg>

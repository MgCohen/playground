<title>Orch Inbox Screens</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a page of phone frames that wrap; each frame is one screen of the orch inbox.
   Theme: Porcelain Orange from the Runner Studio "choice" theme: raised surfaces, carved wells, arc rings. */
:root {
  --page: #f5f4f1; --page-tx: #1b1a18; --page-mu: #5f5b55; --page-line: #dedbd6;
  --canvas: #e6e3de; --canvas-tx: #45423d;
  --surf: #fdfdfc; --text: #1b1a18; --tx2: #3a3834; --muted: #5f5b55; --line-c: rgba(27,26,24,.10);
  --sunken: #dedbd6; --sunken-tx: #1b1a18; --sunken-mu: #66625c;
  --accent: #ff6a1a; --on-accent: #1b1a18; --dim: rgba(27,26,24,.10);
  --done: #23733a; --pending: #8a5a0b; --failed: #b3261e; --new: #1f5fbf;
  --sh-raise: inset 0 1px 0 rgba(255,255,255,.63), inset 0 -3px 7px rgba(60,50,40,.05), 0 2px 3px rgba(60,50,40,.06), 0 10px 21px -8px rgba(60,50,40,.24);
  --sh-raise-sm: inset 0 1px 0 rgba(255,255,255,.63), 0 2px 6px rgba(60,50,40,.12);
  --sh-carve: inset 3.8px 3.8px 8px rgba(60,50,40,.18), inset -2px -2px 4px rgba(255,255,255,.57);
  --sh-glow: 0 0 6px rgba(255,106,26,.25);
  --scrim: rgba(27,26,24,.38);
  --sh-dial: inset 7px 7px 14px rgba(60,50,40,.34), inset -4px -4px 9px rgba(255,255,255,.95), 0 1px 0 rgba(255,255,255,.7);
  --sh-ring: inset 4px 4px 7px rgba(60,40,20,.35), inset -2px -2px 4px rgba(255,255,255,.45);
  --sh-hole: 0 9px 18px rgba(60,50,40,.30), 0 2px 4px rgba(60,50,40,.18), inset 0 1px 0 rgba(255,255,255,.95), inset 0 -4px 8px rgba(60,50,40,.08);
  --hole-bg: radial-gradient(circle at 35% 28%, #ffffff, #f3f2ef 72%);
  --b-q: #ff6a1a; --b-rev: #6f9cff; --b-rep: #8fd94f; --b-blk: #ff5c5c;
  --r: 22px; --r-sm: 12px;
  --f-disp: Doto, "Cascadia Mono", monospace; --f-body: Inter, system-ui, "Segoe UI", sans-serif; --f-mono: "JetBrains Mono", "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #111113; --page-tx: #f4f3f1; --page-mu: #a8a49d; --page-line: #2b2b2f;
  --canvas: #161618; --canvas-tx: #cfccc6;
  --surf: #28282d; --text: #f4f3f1; --tx2: #dcd9d4; --muted: #a8a49d; --line-c: rgba(244,243,241,.10);
  --sunken: #111113; --sunken-tx: #f4f3f1; --sunken-mu: #9a968f;
  --accent: #ff6a1a; --on-accent: #111111; --dim: rgba(244,243,241,.10);
  --done: #7fd18f; --pending: #f0a640; --failed: #f59a9a; --new: #8ab4ff;
  --sh-raise: inset 0 1px 0 rgba(255,255,255,.07), inset 0 -3px 7px rgba(0,0,0,.35), 0 2px 3px rgba(0,0,0,.2), 0 10px 21px -8px rgba(0,0,0,.45);
  --sh-raise-sm: inset 0 1px 0 rgba(255,255,255,.07), 0 2px 6px rgba(0,0,0,.4);
  --sh-carve: inset 3.8px 3.8px 8px rgba(0,0,0,.55), inset -2px -2px 4px rgba(255,255,255,.05);
  --sh-glow: 0 0 6px rgba(255,106,26,.35); --scrim: rgba(0,0,0,.55);
  --sh-dial: inset 7px 7px 14px rgba(0,0,0,.85), inset -3px -3px 8px rgba(255,255,255,.07), 0 1px 0 rgba(255,255,255,.05);
  --sh-ring: inset 4px 4px 7px rgba(0,0,0,.55), inset -2px -2px 4px rgba(255,255,255,.12);
  --sh-hole: 0 10px 20px rgba(0,0,0,.75), 0 2px 4px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -4px 8px rgba(0,0,0,.35);
  --hole-bg: radial-gradient(circle at 35% 28%, #3a3a40, #26262a 72%);
  --b-q: #ff7a2e; --b-rev: #8ab4ff; --b-rep: #a6e86a; --b-blk: #ff6b6b;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --page: #111113; --page-tx: #f4f3f1; --page-mu: #a8a49d; --page-line: #2b2b2f;
  --canvas: #161618; --canvas-tx: #cfccc6;
  --surf: #28282d; --text: #f4f3f1; --tx2: #dcd9d4; --muted: #a8a49d; --line-c: rgba(244,243,241,.10);
  --sunken: #111113; --sunken-tx: #f4f3f1; --sunken-mu: #9a968f;
  --accent: #ff6a1a; --on-accent: #111111; --dim: rgba(244,243,241,.10);
  --done: #7fd18f; --pending: #f0a640; --failed: #f59a9a; --new: #8ab4ff;
  --sh-raise: inset 0 1px 0 rgba(255,255,255,.07), inset 0 -3px 7px rgba(0,0,0,.35), 0 2px 3px rgba(0,0,0,.2), 0 10px 21px -8px rgba(0,0,0,.45);
  --sh-raise-sm: inset 0 1px 0 rgba(255,255,255,.07), 0 2px 6px rgba(0,0,0,.4);
  --sh-carve: inset 3.8px 3.8px 8px rgba(0,0,0,.55), inset -2px -2px 4px rgba(255,255,255,.05);
  --sh-glow: 0 0 6px rgba(255,106,26,.35); --scrim: rgba(0,0,0,.55);
  --sh-dial: inset 7px 7px 14px rgba(0,0,0,.85), inset -3px -3px 8px rgba(255,255,255,.07), 0 1px 0 rgba(255,255,255,.05);
  --sh-ring: inset 4px 4px 7px rgba(0,0,0,.55), inset -2px -2px 4px rgba(255,255,255,.12);
  --sh-hole: 0 10px 20px rgba(0,0,0,.75), 0 2px 4px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -4px 8px rgba(0,0,0,.35);
  --hole-bg: radial-gradient(circle at 35% 28%, #3a3a40, #26262a 72%);
  --b-q: #ff7a2e; --b-rev: #8ab4ff; --b-rep: #a6e86a; --b-blk: #ff6b6b;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--page); color: var(--page-tx); font: 14px/1.45 var(--f-body); }
main { padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1680px; margin: 0 auto; }
h1 { font: 800 30px/1 var(--f-disp); letter-spacing: .02em; margin: 0 0 8px; }
.lede { margin: 0 0 24px; color: var(--page-mu); max-width: 72ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 28px 20px; }
figure { margin: 0; min-width: 0; display: grid; gap: 8px; align-content: start; }
.tabs { display: flex; gap: 6px; margin: 0 0 20px; }
.tabs button { font: 600 13px var(--f-body); color: var(--page-tx); background: transparent; border: 1px solid var(--page-line); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--page-tx); color: var(--page); border-color: var(--page-tx); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
figcaption { font-size: 13px; color: var(--page-mu); max-width: 390px; }
figcaption b { color: var(--page-tx); font-weight: 600; display: block; }

/* ===== Phone frame ===== */
.w { width: 100%; max-width: 390px; height: 780px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 12px 10px 10px;
  background: var(--canvas); color: var(--text); font: 13px/1.38 var(--f-body); border-radius: 30px; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 20px 40px -20px rgba(0,0,0,.4); }
.w svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
.crd { background: var(--surf); box-shadow: var(--sh-raise); border-radius: var(--r); flex: none; position: relative; min-width: 0; }
.well { background: var(--sunken); box-shadow: var(--sh-carve); color: var(--sunken-tx); border-radius: var(--r-sm); }
.gt { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--canvas-tx); margin: 2px 6px -4px; flex: none; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-width: 0; }
.sep { border-top: 1px solid var(--line-c); }
.grow { flex: 1; min-width: 0; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nm { font-weight: 600; }
.sub { font-size: 11.5px; color: var(--muted); }
.t2 { color: var(--tx2); }
.mono { font-family: var(--f-mono); font-size: 11.5px; }
.disp { font-family: var(--f-disp); font-weight: 800; letter-spacing: .02em; }
.ib { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r-sm); color: var(--muted); flex: none; }
.nav { display: flex; gap: 6px; padding: 5px; flex: none; }
.ni { flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 9px 2px; font-size: 12px; border-radius: 9px; color: var(--sunken-mu); font-weight: 500; }
.ni.act { background: var(--surf); color: var(--text); box-shadow: var(--sh-raise-sm); font-weight: 600; }
.ni.act svg { color: var(--accent); }
.badge { font: 600 10px/1 var(--f-body); background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 3px 6px; }
.bar { display: flex; gap: 8px; flex: none; align-items: stretch; }
.hd { padding: 11px 16px; }
.hd .title { font-size: 19px; line-height: 1.1; }
/* Light header on the canvas: screen name, one line of context, and one round action */
.top { display: flex; align-items: center; gap: 10px; padding: 2px 6px 0; flex: none; }
.top .title { font-size: 24px; line-height: 1; color: var(--text); }
.top .sub { margin-top: 3px; color: var(--canvas-tx); }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--canvas-tx); }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--done); box-shadow: 0 0 0 3px color-mix(in srgb, var(--done) 20%, transparent); }
.rb { width: 38px; height: 38px; border-radius: 50%; background: var(--surf); box-shadow: var(--sh-raise-sm); display: grid; place-items: center; flex: none; color: var(--text); }
.rb.pri { background: var(--accent); color: var(--on-accent); box-shadow: var(--sh-raise-sm), var(--sh-glow); }
.seg { display: flex; padding: 4px; gap: 4px; flex: 1; min-width: 0; }
.seg span { flex: 1; text-align: center; padding: 6px 4px; border-radius: 9px; color: var(--sunken-mu); font-size: 12px; white-space: nowrap; }
.seg span.on { background: var(--accent); color: var(--on-accent); font-weight: 600; box-shadow: var(--sh-glow); }
.fbtn { width: 42px; border-radius: var(--r-sm); background: var(--surf); box-shadow: var(--sh-raise-sm); display: grid; place-items: center; position: relative; flex: none; }
.fbtn i { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.lock { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--surf); box-shadow: var(--sh-raise-sm); font-weight: 600; font-size: 12px; flex: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 46px; padding: 0 14px; border-radius: var(--r-sm); background: var(--surf); box-shadow: var(--sh-raise); color: var(--text); font-weight: 600; flex: 1; }
.btn.pri { background: var(--accent); color: var(--on-accent); box-shadow: var(--sh-raise), var(--sh-glow); }
.btn.wl { background: var(--sunken); box-shadow: var(--sh-carve); color: var(--sunken-mu); flex: 0 0 64px; }
.acts { display: flex; gap: 8px; flex: none; }
.acts.off .btn { opacity: .38; box-shadow: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; color: var(--st); background: color-mix(in srgb, var(--st) 14%, transparent); border: 1px solid color-mix(in srgb, var(--st) 40%, transparent); white-space: nowrap; flex: none; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--st); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { padding: 7px 12px; border-radius: 999px; background: var(--surf); box-shadow: var(--sh-raise-sm); font-weight: 500; }
.chip.def { outline: 2px solid var(--accent); outline-offset: -2px; font-weight: 600; }
.chip.pick { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.kv { display: flex; align-items: center; gap: 10px; padding: 9px 12px; }
.kv + .kv { border-top: 1px solid var(--line-c); }
.kv .k { flex: 1; color: var(--tx2); }
.back { display: flex; align-items: center; gap: 4px; color: var(--canvas-tx); font-weight: 600; padding: 2px 4px; flex: none; }
.pad { padding: 12px 14px; }
.met { padding: 10px 12px; display: grid; gap: 2px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: none; }


/* Home */
.bento { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: none; }
.span2 { grid-column: span 2; }
.lg { display: grid; gap: 7px; }
.lgr { display: flex; align-items: center; gap: 8px; }
.lgd { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.lgr b { font: 800 15px var(--f-disp); }
.dotc { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; }
.dotc i { aspect-ratio: 1; border-radius: 50%; background: var(--dim); }
.dotc i.lit { background: var(--accent); }
.tile { padding: 12px; display: grid; gap: 4px; align-content: start; }
.big { font: 800 26px/1 var(--f-disp); }

.fill { flex: 1; min-height: 0; }
.g23 { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 10px; flex: 1; min-height: 0; }
.g23 > .crd, .tiles > .crd { display: flex; flex-direction: column; gap: 6px; padding: 12px; overflow: hidden; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: none; }
.tt { display: flex; align-items: center; gap: 6px; }
.tt .sub { flex: 1; }
.ctr { flex: 1; display: grid; place-items: center; }
.cnt4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; flex: none; }
.cnt4 .well { padding: 10px; display: grid; gap: 2px; }
.stack { display: flex; flex-direction: column; overflow: hidden; }

/* Home G: flat ring, soft colors, no depth */
.fring { position: relative; flex: none; display: grid; place-items: center; border-radius: 50%; }
.fring .fill { position: absolute; inset: 0; border-radius: 50%; -webkit-mask: radial-gradient(circle, transparent calc(50% - var(--th) - 1px), #000 calc(50% - var(--th))); mask: radial-gradient(circle, transparent calc(50% - var(--th) - 1px), #000 calc(50% - var(--th))); }
.fring .hole { position: absolute; inset: var(--th); border-radius: 50%; background: var(--surf); }
.fring .rc { position: relative; display: grid; place-items: center; line-height: 1; color: var(--text); }
.scroll { overflow: hidden; }
.foldh { display: flex; align-items: center; gap: 10px; padding: 12px; }
.seeall { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 11px; border-top: 1px solid var(--line-c); font-weight: 600; color: var(--accent); }
.empty { border: 2px dashed var(--dim); border-radius: var(--r); padding: 22px 16px; display: grid; place-items: center; gap: 4px; text-align: center; color: var(--canvas-tx); }

/* Deep ring: carved channel, carved fill, raised center */
.dring { position: relative; flex: none; border-radius: 50%; background: var(--sunken); box-shadow: var(--sh-dial); }
.dring .fill { position: absolute; inset: 4px; border-radius: 50%; }
.dring .fill::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: var(--sh-ring); }
.dring .hole { position: absolute; inset: calc(var(--th) + 4px); border-radius: 50%; background: var(--hole-bg); box-shadow: var(--sh-hole); display: grid; place-items: center; text-align: center; line-height: 1; color: var(--text); }
/* App bar: floating pill, Home raised in the center, a dot under the active item */
.nav2 { position: relative; display: flex; align-items: center; justify-content: space-around; height: 58px; margin: 18px 4px 2px; border-radius: 999px; background: var(--surf); box-shadow: var(--sh-raise); flex: none; }
.nav2 .it { width: 46px; height: 46px; display: grid; place-items: center; color: var(--muted); position: relative; }
.nav2 svg { width: 22px; height: 22px; }
.nav2 .it.on { color: var(--text); }
.nav2 .it.on::after { content: ""; position: absolute; left: 50%; margin-left: -3px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.nav2 .it.on::after { bottom: 1px; }
.nav2 .home { width: 62px; height: 62px; margin-top: -30px; border-radius: 50%; color: var(--on-accent); display: grid; place-items: center; position: relative;
  background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 92%, #ffffff), color-mix(in srgb, var(--accent) 94%, #000000));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -3px 6px rgba(110,35,0,.14), 0 6px 12px rgba(120,45,5,.24), 0 2px 3px rgba(120,45,5,.18); }

.nav2 .home svg { width: 26px; height: 26px; }
.nav2 .bdg { position: absolute; top: 3px; right: 0; font: 700 9px/1 var(--f-body); background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 3px 5px; }
/* Arc ring */
.ring { position: relative; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--sunken); box-shadow: var(--sh-carve); }
.ring .fill { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--rc, var(--accent)) calc(var(--p) * 1turn), transparent 0);
  -webkit-mask: radial-gradient(circle, transparent calc(50% - var(--th) - 1px), #000 calc(50% - var(--th))); mask: radial-gradient(circle, transparent calc(50% - var(--th) - 1px), #000 calc(50% - var(--th))); }
.ring .hole { position: absolute; inset: calc(var(--th) + 1px); border-radius: 50%; background: var(--surf); box-shadow: var(--sh-raise-sm); }
.ring .rc { position: relative; z-index: 2; display: grid; place-items: center; text-align: center; color: var(--tx2); line-height: 1; }

/* Card pile: the next cards peek out under the top card */
.pile { position: relative; flex: 1; min-height: 0; }
.pile .ghost { position: absolute; height: 40px; border-radius: var(--r); background: var(--surf); box-shadow: var(--sh-raise-sm); }
.pile .g1 { bottom: 6px; left: 8px; right: 8px; opacity: .8; }
.pile .g2 { bottom: 0; left: 18px; right: 18px; opacity: .55; }
.card { position: absolute; inset: 0 0 14px; display: flex; flex-direction: column; }
.card .head { border-bottom: 1px solid var(--line-c); padding: 12px 14px; }
.card .in { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
.q { font-size: 20px; line-height: 1.25; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; margin: 0; }
.rec { padding: 10px 12px; }
.rec .sub { display: block; margin-bottom: 2px; color: var(--sunken-mu); }
.foot { margin-top: auto; display: flex; align-items: center; gap: 10px; }

/* Timeline with ring nodes on a carved line */
.tl { position: relative; display: grid; gap: 8px; padding-left: 40px; flex: none; }
.tl::before { content: ""; position: absolute; left: 14px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--sunken); box-shadow: var(--sh-carve); }
.tl > div { position: relative; min-width: 0; }
.tl .node { position: absolute; left: -40px; top: 50%; transform: translateY(-50%); border-radius: 50%; background: var(--canvas); box-shadow: 0 0 0 3px var(--canvas); line-height: 0; }
.ev .l1 { display: flex; gap: 8px; align-items: baseline; }
.ev .l3 { display: flex; gap: 8px; align-items: center; margin-top: 4px; min-width: 0; }
.chev { color: var(--muted); }

/* Sheet */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 4; }
.sheet { position: absolute; left: 6px; right: 6px; bottom: 6px; z-index: 5; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px; border-radius: 26px; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--dim); align-self: center; }
.ta { padding: 12px; font-size: 15px; min-height: 84px; line-height: 1.4; }
.mic { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); box-shadow: var(--sh-raise), 0 0 0 8px color-mix(in srgb, var(--accent) 18%, transparent), var(--sh-glow); flex: none; }
.mic svg { width: 26px; height: 26px; }
.wave { display: flex; gap: 3px; align-items: center; height: 28px; }
.wave i { width: 4px; border-radius: 2px; background: var(--accent); }
.fsec { display: grid; gap: 6px; }
.tg { width: 32px; height: 19px; border-radius: 10px; background: var(--sunken); box-shadow: var(--sh-carve); position: relative; flex: none; }
.tg i { position: absolute; top: 3px; left: 3px; width: 13px; height: 13px; border-radius: 50%; background: var(--surf); box-shadow: 0 2px 4px rgba(0,0,0,.3); }
.tg.on { background: var(--accent); box-shadow: inset 2px 2px 4px rgba(0,0,0,.25), var(--sh-glow); }
.tg.on i { left: 16px; }
.doc ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
@media (prefers-reduced-motion: no-preference) { .mic { animation: pulse 1.8s ease-in-out infinite; } @keyframes pulse { 50% { box-shadow: var(--sh-raise), 0 0 0 14px color-mix(in srgb, var(--accent) 10%, transparent), var(--sh-glow); } } }
</style>

<main>
  <h1>Orch Inbox Screens</h1>
  <p class="lede">The main screens of the orchestrator UI in the Porcelain Orange theme of Runner Studio. The screens are static and follow the approved flow. Home is the start screen. A card shows the preview render of its template; Open shows the full render of the same template.</p>
  <div class="grid" id="grid-screens"></div>
</main>

<script>
const I = {
  home: '<path d="M5 12H3l9-9 9 9h-2"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1l2.1-2.1M17 7l2.1-2.1"/>',
  cards: '<rect x="5" y="4" width="14" height="16" rx="3"/><path d="M8 2h8"/>',
  stream: '<path d="M4 7h16M4 12h10M4 17h13"/>',
  tree: '<circle cx="6" cy="5" r="2"/><circle cx="18" cy="12" r="2"/><circle cx="18" cy="19" r="2"/><path d="M6 7v10a2 2 0 0 0 2 2h8M6 12h10"/>',
  q: '<path d="M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .9-1 1.7V15M12 18h.01"/>',
  check: '<path d="M5 12l5 5 9-11"/>', pen: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/>', down: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  alert: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>', doc: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>',
  review: '<path d="M4 12l4 4 12-12"/><path d="M4 20h16"/>', chevL: '<path d="M15 6l-6 6l6 6"/>', chevD: '<path d="M6 9l6 6l6-6"/>', chevR: '<path d="M9 6l6 6l-6 6"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>', link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  git: '<circle cx="6" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 8v8M18 10c0 4-6 3-10 6"/>', search: '<circle cx="10" cy="10" r="7"/><path d="M21 21l-6-6"/>',
  brief: '<path d="M4 7h16v12H4z"/><path d="M9 7V5h6v2"/>', filter: '<path d="M4 6h16M7 12h10M10 18h4"/>', lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
};
const ic = n => `<svg viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const KIND = { decision: ['q', 'new'], question: ['q', 'pending'], review: ['review', 'new'], report: ['doc', 'done'], blocked: ['alert', 'failed'], update: ['stream', 'muted'], brief: ['brief', 'muted'], answer: ['pen', 'accent'] };
const ring = (p, size, th, center, color = 'var(--accent)') => `<span class="ring" style="width:${size}px;height:${size}px;--p:${p};--th:${th}px;--rc:${color}"><span class="fill"></span><span class="hole"></span><span class="rc">${center}</span></span>`;
const kindRing = (k, p = 1, size = 32) => { const [icon, st] = KIND[k]; return ring(p, size, Math.round(size / 7), ic(icon), `var(--${st})`); };
const pill = (label, st) => `<span class="pill" style="--st:var(--${st})">${label}</span>`;
const crd = (h, c = '') => `<div class="crd ${c}">${h}</div>`;
const well = (h, c = '') => `<div class="well ${c}">${h}</div>`;
const tg = on => `<span class="tg ${on ? 'on' : ''}"><i></i></span>`;
const hdr = title => crd(`<div class="title disp">${title}</div>`, 'hd');
const LIVE = '<span class="live">live</span>';
const nav = act => { const it = (k, label, extra = '') => `<span class="it ${act === k ? 'on' : ''}" aria-label="${label}">${ic(k)}${extra}</span>`;
  return `<nav class="nav2" aria-label="Views">${it('cards', 'Cards', '<span class="bdg">7</span>')}${it('stream', 'Stream')}<span class="home ${act === 'home' ? 'on' : ''}" aria-label="Home">${ic('home')}</span>${it('tree', 'Sessions')}${it('gear', 'Settings')}</nav>`; };
const seg = (items, on) => well(items.map((x, i) => `<span class="${i === on ? 'on' : ''}">${x}</span>`).join(''), 'seg');
const fbar = (items, on, active) => `<div class="bar">${seg(items, on)}<span class="fbtn" aria-label="Filter and order">${ic('filter')}${active ? '<i></i>' : ''}</span></div>`;
const frame = inner => `<div class="w">${inner}</div>`;

// Card in the pile: the preview render of its template.
const pileCard = () => `<div class="pile"><span class="ghost g2"></span><span class="ghost g1"></span>
  ${crd(`<div class="row head">${kindRing('decision')}<div class="grow"><div class="nm">Decision</div><div class="sub ell">A3 · stream queries</div></div><span class="mono sub">14:30</span></div>
  <div class="in"><p class="q">Which sweep interval do we use for lost watcher events?</p>
    ${well('<span class="sub">Recommendation</span>60 s. It is the default in policy.json.', 'rec')}
    <div class="foot"><div class="chips grow"><span class="chip def">60 s</span><span class="chip">30 s</span><span class="chip">120 s</span></div>${ring(.62, 50, 6, '<span class="disp" style="font-size:12px">3:42</span>')}</div>
  </div>`, 'card')}</div>`;

// One stream: the global one, or the same one locked to a session.
const STREAM = [
  ['blocked', .15, 'Blocked', 'B2', '14:32', 'The lease test cannot start.', ['waits', 'failed']],
  ['decision', .5, 'Decision', 'A3', '14:30', 'Which sweep interval do we use?', ['waits', 'pending']],
  ['answer', 1, 'Answer', 'you → child 2', '14:28', 'my answer is: 9', ['delivered', 'done']],
  ['decision', .5, 'Decision', 'A3', '14:26', 'May I keep the old routes until A4 is merged?', ['waits', 'pending']],
  ['update', 1, 'Update', 'A3', '14:24', 'Step 3 of 5: query routes', ['update', 'new']],
  ['review', .5, 'Review', 'child 3', '14:07', 'Default 8 after 30 s', ['waits', 'pending']],
  ['question', 1, 'Question', 'A3', '13:50', 'Which store does the live test use?', ['answered', 'done']],
  ['brief', 1, 'Brief', 'root → A3', '13:41', 'A3: stream queries and API routes', ['delivered', 'done']],
];
const timeline = rows => `<div class="tl">${rows.map(([k, p, n, who, t, s, [pl, st]]) => `<div><span class="node">${kindRing(k, p, 30)}</span>${crd(`<div class="row"><div class="grow ev"><div class="l1"><b class="grow ell">${n} · ${who}</b><span class="mono sub">${t}</span></div><div class="t2 ell">${s}</div><div class="l3">${pill(pl, st)}</div></div></div>`)}</div>`).join('')}</div>`;

// One session row, the same in the Sessions list and in the children of a status page.
const sRow = ([n, s, p, l, st, kids], first, fold) => `<div class="row ${first ? '' : 'sep'}">${ring(p, kids ? 34 : 28, kids ? 5 : 4, kids ? ic('tree') : '', `var(--${st})`)}<div class="grow"><div class="ell ${kids ? 'nm' : ''}">${n}</div><div class="sub ell">${s}</div></div>${pill(l, st)}${fold ? `<span class="chev">${ic(fold === 'open' ? 'chevD' : 'chevR')}</span>` : ''}</div>`;
const A3KIDS = [['A3.1: query filter', 'Done · PR #15', 1, 'done', 'done'], ['A3.2: route tests', 'Step 2 of 4', .5, 'running', 'pending']];


const ACT = [1, 0, 0, 0, 0, 0, 0, 1, 2, 3, 2, 4, 5, 3, 6, 5, 4, 6, 5, 3, 2, 4, 6, 5];
const dots = () => { let h = ''; for (let r = 5; r >= 0; r--) for (let c = 0; c < 24; c++) h += `<i class="${ACT[c] > r ? 'lit' : ''}"></i>`; return `<div class="dotc">${h}</div>`; };
const legend = rows => `<div class="lg">${rows.map(([k, v, st]) => `<div class="lgr"><span class="lgd" style="background:var(--${st})"></span><span class="grow t2">${k}</span><b>${v}</b></div>`).join('')}</div>`;
const WAIT = [['Questions', 4, 'new'], ['Reviews', 1, 'pending'], ['Reports', 1, 'done'], ['Blocked', 1, 'failed']];
const waitRing = (size, th) => { let a = 0; const segs = WAIT.map(([, n, st]) => { const p = n / 7, seg = `var(--${st}) ${a}turn ${a + p}turn`; a += p; return seg; }).join(', ');
  return `<span class="ring" style="width:${size}px;height:${size}px;--th:${th}px"><span class="fill" style="background:conic-gradient(${segs})"></span><span class="hole"></span><span class="rc"><span class="disp" style="font-size:${Math.round(size / 4)}px">7</span><span class="sub">wait</span></span></span>`; };
const lastCard = () => crd(`<div class="row">${kindRing('blocked', .15)}<div class="grow"><div class="sub">Last arrived · 2 min ago</div><div class="nm ell">The lease test cannot start.</div><div class="sub">B2 · session states</div></div><span class="chev">${ic('chevR')}</span></div>`);
const activeCard = () => crd(`<div class="row">${ring(.6, 40, 6, '<span class="mono" style="font-size:10px">3/5</span>')}<div class="grow"><div class="sub">Latest active session</div><div class="nm ell">A3: stream queries</div><div class="sub ell">Step 3 of 5 · query routes · 1 min ago</div></div>${pill('running', 'pending')}</div>`);
const go = '<span class="chev">' + ic('chevR') + '</span>';
const tt = (label, icon) => `<div class="tt">${ic(icon)}<span class="sub">${label}</span>${go}</div>`;
const SESS = [['A3: stream queries', 'Step 3 of 5 · 1 min ago', .6, 'running', 'pending'], ['A4: inbox UI', 'Design round 3 · 4 min ago', .3, 'running', 'pending'], ['B2: session states', 'Report blocked · 2 min ago', .8, 'blocked', 'failed'], ['Sum test: root', 'Adds 3 numbers · 9 min ago', .7, 'running', 'pending']];
const HELP = [['Phone: color', 'Stop latch: type in the session', .2, 'not responding', 'failed'], ['Sum: child 1', 'Idle 15 min, no final report', .5, 'forgotten', 'pending']];
const RECENT = [['blocked', .15, 'The lease test cannot start.', 'B2 · 2 min'], ['decision', .5, 'Which sweep interval do we use?', 'A3 · 6 min'], ['review', .5, 'Which number do you pick?', 'child 3 · 25 min']];
const recentRows = n => RECENT.slice(0, n).map(([k, p, t, w], i) => `<div class="row ${i ? 'sep' : ''}">${kindRing(k, p, 28)}<div class="grow"><div class="ell">${t}</div><div class="sub">${w}</div></div></div>`).join('');
const soft = st => `color-mix(in srgb, var(--${st}) 55%, var(--surf))`;
const flatRing = (size, th) => { let a = 0; const segs = WAIT.map(([, n, st]) => { const p = n / 7, g = `${soft(st)} ${a}turn ${a + p - .006}turn, transparent ${a + p - .006}turn ${a + p}turn`; a += p; return g; }).join(', ');
  return `<span class="fring" style="width:${size}px;height:${size}px;--th:${th}px"><span class="fill" style="background:conic-gradient(${segs})"></span><span class="hole"></span><span class="rc"><span class="disp" style="font-size:${Math.round(size / 3.6)}px">7</span><span class="sub">wait</span></span></span>`; };
const softLegend = () => `<div class="lg">${WAIT.map(([k, v, st]) => `<div class="lgr"><span class="lgd" style="background:${soft(st)}"></span><span class="grow t2">${k}</span><b>${v}</b></div>`).join('')}</div>`;
const BW = [['Questions', 4, 'b-q'], ['Reviews', 1, 'b-rev'], ['Reports', 1, 'b-rep'], ['Blocked', 1, 'b-blk']];
const deepRing = (size, th, center, segs) => `<span class="dring" style="width:${size}px;height:${size}px;--th:${th}px"><span class="fill" style="background:${segs}"></span><span class="hole">${center}</span></span>`;
const waitSegs = () => { let a = 0; return 'conic-gradient(' + BW.map(([, n, c]) => { const p = n / 7, g = `var(--${c}) ${a}turn ${a + p}turn`; a += p; return g; }).join(', ') + ')'; };
const brightLegend = () => `<div class="lg">${BW.map(([k, v, c]) => `<div class="lgr"><span class="lgd" style="background:var(--${c})"></span><span class="grow t2">${k}</span><b>${v}</b></div>`).join('')}</div>`;
const waitBlock = () => crd(`<div class="row" style="gap:18px;padding:16px 14px">${deepRing(118, 14, '<span><span class="disp" style="font-size:30px">7</span><br><span class="sub">wait</span></span>', waitSegs())}<div class="grow">${brightLegend()}</div>${go}</div>`);
const sessFold = open => crd(`<div class="foldh">${ring(.6, 40, 6, '<span class="mono" style="font-size:10px">3/5</span>')}<div class="grow"><div class="sub">Active sessions · 5 of 8</div><div class="nm ell">A3: stream queries</div><div class="sub ell">Step 3 of 5 · 1 min ago</div></div><span class="chev">${ic(open ? 'chevD' : 'chevR')}</span></div>`
  + (open ? SESS.slice(1).map(r => sRow(r, false, '')).join('') + `<div class="seeall">See all 8 sessions ${ic('chevR')}</div>` : ''));
const eventsBlock = () => crd(`<div class="pad" style="display:grid;gap:8px"><div class="row" style="padding:0"><span class="sub grow">Events · last 24 h</span><span class="mono sub">42 today</span></div>${dots()}</div>`);
const MORE = RECENT.concat([['question', .5, 'Which store does the live test use?', 'A3 · 1 h'], ['report', 1, 'All communication goes through the Stream API.', 'A2 · 1 h']]);
const arrivals = n => crd(MORE.slice(0, n).map(([k, p, t, w], i) => `<div class="row ${i ? 'sep' : ''}">${kindRing(k, p, 28)}<div class="grow"><div class="ell">${t}</div><div class="sub">${w}</div></div>${go}</div>`).join(''));
const HOME = [
  ['Home G: A, tweaked', 'Base A. A deep ring: carved channel, carved fill in the bright colors, and a raised center. The app bar floats, with Home raised in the center and a dot under the active side item. Active sessions fold open, with See all. The events chart stays. Waiting items follow as a list that grows, and the page scrolls.', () => frame(
    hdr('Home') + `<div class="body scroll">${waitBlock()}${sessFold(true)}${eventsBlock()}<div class="gt">Waiting · newest first</div>${arrivals(5)}</div>` + nav('home'))],
  ['Home G: closed and empty', 'The same page with the sessions folded and nothing waiting: the list shows a dashed empty block.', () => frame(
    hdr('Home') + `<div class="body">${crd(`<div class="row" style="gap:18px;padding:14px">${deepRing(118, 14, '<span><span class="disp" style="font-size:30px">0</span><br><span class="sub">wait</span></span>', 'var(--sunken)')}<div class="grow"><div class="nm">Nothing waits for you</div><div class="sub" style="margin-top:4px">Last card closed 12 min ago</div></div></div>`)}${sessFold(false)}${eventsBlock()}<div class="gt">Waiting · newest first</div><div class="empty"><span class="nm">Nothing waiting</span><span class="sub">New cards show here when they arrive.</span></div></div>` + nav('home'))],
  ['Home A: bento', 'First version. A summary in tiles. The ring splits the waiting cards by type.', () => frame(
    hdr('Home') + `<div class="body"><div class="bento">
      ${crd(`<div class="row" style="gap:16px;padding:14px">${waitRing(112, 13)}<div class="grow">${legend(WAIT)}</div></div>`, 'span2')}
      ${crd(`<span class="sub">Last arrived</span><span class="big">2m</span><span class="sub ell">Blocked · B2</span>`, 'tile')}
      ${crd(`<span class="sub">Sessions</span><span class="big">8</span><span class="sub">5 run · 2 need help</span>`, 'tile')}
      <div class="span2">${activeCard()}</div>
      ${crd(`<div class="pad" style="display:grid;gap:8px"><div class="row" style="padding:0"><span class="sub grow">Events · last 24 h</span><span class="mono sub">42 today</span></div>${dots()}</div>`, 'span2')}
    </div><div class="acts" style="margin-top:auto"><span class="btn pri">${ic('cards')}Go through 7 cards</span></div></div>` + nav('home'))],
  ['Home B: next up', 'First version. A short list: what waits, what arrived last, which session moves now, and which sessions need help.', () => frame(
    hdr('Home') + `<div class="body">
      ${crd(`<div class="row" style="gap:14px;padding:14px">${waitRing(84, 10)}<div class="grow"><div class="nm" style="font-size:15px">7 cards wait for you</div><div class="sub">Oldest 1 h · next default in 3:42</div><div class="chips" style="margin-top:8px"><span class="chip">4 questions</span><span class="chip">1 review</span></div></div></div>`)}
      <div class="gt">Last arrived</div>${lastCard()}
      <div class="gt">Active now</div>${activeCard()}
      <div class="gt">Needs help · 2</div>${crd([['Phone: color', 'Stop latch: type in the session', .2, 'not responding', 'failed'], ['Sum: child 1', 'Idle 15 min, no final report', .5, 'forgotten', 'pending']].map((r, i) => sRow(r, !i, '')).join(''))}
      <div class="grid3">${[['Active', '8'], ['Events', '42'], ['Done', '3']].map(([k, v]) => well(`<span class="sub" style="color:var(--sunken-mu)">${k}</span><span class="disp" style="font-size:20px">${v}</span>`, 'met')).join('')}</div>
    </div>` + nav('home'))],
  ['Home C: ring first', 'The ring of waiting cards fills the top. Four tiles below, then the latest active session. Each block opens its screen.', () => frame(
    hdr('Home') + `<div class="body">
      ${crd(`${tt('Waiting for you', 'cards')}<div class="row fill" style="gap:18px;padding:4px 0 0">${waitRing(150, 16)}<div class="grow">${legend(WAIT)}<div class="sub" style="margin-top:10px">Oldest 1 h · next default 3:42</div></div></div>`, 'fill pad" style="display:flex;flex-direction:column')}
      <div class="tiles">
        ${crd(`${tt('Last arrived', 'alert')}<span class="big">2m</span><span class="sub ell">Blocked · B2</span>`)}
        ${crd(`${tt('Sessions', 'tree')}<span class="big">8</span><span class="sub">5 run · 1 done</span>`)}
        ${crd(`${tt('Need help', 'alert')}<span class="big" style="color:var(--failed)">2</span><span class="sub ell">Phone: color, Sum: child 1</span>`)}
        ${crd(`${tt('Events today', 'stream')}<span class="big">42</span><span class="sub">6 in the last hour</span>`)}
      </div>
      ${activeCard()}
    </div>` + nav('home'))],
  ['Home D: status board', 'Six equal tiles fill the screen. Each tile is one status and opens its screen.', () => frame(
    hdr('Home') + `<div class="body"><div class="g23">
      ${crd(`${tt('Waiting', 'cards')}<div class="ctr">${waitRing(96, 11)}</div>`)}
      ${crd(`${tt('Next default', 'q')}<div class="ctr">${ring(.62, 96, 11, '<span class="disp" style="font-size:20px">3:42</span><span class="sub">A3</span>')}</div>`)}
      ${crd(`${tt('Last arrived', 'alert')}<span class="big">2m</span><span class="nm ell" style="white-space:normal">The lease test cannot start.</span><span class="sub">B2 · blocked</span>`)}
      ${crd(`${tt('Sessions', 'tree')}<div class="ctr">${ring(5 / 8, 96, 11, '<span class="disp" style="font-size:22px">5/8</span><span class="sub">run</span>', 'var(--done)')}</div>`)}
      ${crd(`${tt('Need help', 'alert')}<span class="big" style="color:var(--failed)">2</span><div class="sub">Phone: color<br>Sum: child 1</div>`)}
      ${crd(`${tt('Events · 24 h', 'stream')}<span class="big">42</span><div style="margin-top:auto">${dots()}</div>`)}
    </div></div>` + nav('home'))],
  ['Home E: feed of status', 'Stacked sections from the top down: waiting, need help, active sessions, and the last arrivals. The last section fills the rest.', () => frame(
    hdr('Home') + `<div class="body">
      <div class="cnt4">${WAIT.map(([k, n, st]) => well(`<span class="disp" style="font-size:20px;color:var(--${st})">${n}</span><span class="sub" style="color:var(--sunken-mu)">${k}</span>`)).join('')}</div>
      <div class="gt">Need help · 2</div>${crd(HELP.map((r, i) => sRow(r, !i, '')).join(''))}
      <div class="gt">Active sessions · 5</div>${crd(SESS.slice(0, 3).map((r, i) => sRow(r, !i, '')).join(''))}
      <div class="gt">Last arrived</div>${crd(recentRows(3), 'fill stack')}
    </div>` + nav('home'))],
  ['Home F: sessions first', 'Each active session is a card with its own waiting cards. The strip on top gives the totals.', () => frame(
    hdr('Home') + `<div class="body">
      ${crd(`<div class="row" style="gap:12px">${waitRing(56, 7)}<div class="grow"><div class="nm">7 cards wait</div><div class="sub">2 sessions need help · 42 events today</div></div>${go}</div>`)}
      ${[['Orchestrator: root', 'Waits for 4 children', .4, 'idle', 'new', [['A3: stream queries', '2 cards · step 3 of 5', .6, 'running', 'pending'], ['B2: session states', '1 card · blocked', .8, 'blocked', 'failed'], ['A2: communication code', '1 card · report', 1, 'done', 'done']]],
         ['Sum test: root', 'Adds 3 numbers', .7, 'running', 'pending', [['Sum: child 3', '1 card · review', 1, 'done', 'done'], ['Sum: child 1', 'no final report', .5, 'forgotten', 'pending']]],
         ['Phone: color', '1 card · stop latch', .2, 'not responding', 'failed', []]]
        .map(([n, sb, p, l, st, kids], i) => crd(sRow([n, sb, p, l, st, kids.length || 0], true, '') + kids.map(k => sRow(k, false, '')).join(''), i === 0 ? '' : '')).join('')}
    </div>` + nav('home'))],
];

const SCREENS = [
  ['Cards', 'A small header with the screen name only. The filter button opens filter and order. The ring is the only timer. The labels come from the card type.', () => frame(
    hdr('Cards') + `<div class="body">${fbar(['All', 'Questions 4', 'Reviews 1', 'Reports 2'], 0)}${pileCard()}
      <div class="acts"><span class="btn">${ic('pen')}Other</span><span class="btn wl" aria-label="Skip">${ic('down')}</span><span class="btn pri">${ic('check')}Accept</span></div></div>`
    + nav('cards'))],

  ['Filter and order', 'The same sheet serves Cards and Stream. A dot on the filter button shows active filters.', () => frame(
    hdr('Cards') + `<div class="body">${fbar(['All', 'Questions 4', 'Reviews 1', 'Reports 2'], 0, true)}${pileCard()}</div>` + nav('cards')
    + `<div class="scrim"></div>` + crd(`<span class="grab"></span>
      <div class="row" style="padding:0"><div class="grow nm" style="font-size:16px">Filter and order</div><span class="sub">Reset</span></div>
      <div class="fsec"><span class="gt" style="margin:0">Order</span>${seg(['Arrival', 'Newest', 'Session', 'Default time'], 0)}</div>
      <div class="fsec"><span class="gt" style="margin:0">Date</span>${seg(['Today', '7 days', 'All'], 2)}</div>
      <div class="fsec"><span class="gt" style="margin:0">Sessions</span>${crd([['Orchestrator: root', 'and 4 children', true], ['Sum test: root', 'and 3 children', false], ['Phone: color', 'no children', true]]

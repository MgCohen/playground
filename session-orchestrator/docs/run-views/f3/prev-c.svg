-api: Comma is the RFC 4180 default.</text><text x="16.0" y="410.0" font-size="9" class="m mono" font-weight="600">FIELDS</text><rect x="16.0" y="415.0" width="328.0" height="25.0" rx="6" class="soft"/><rect x="16.0" y="415.0" width="328.0" height="25.0" rx="6" fill="none" class="lnS" stroke-width="1"/><text x="24.0" y="431.0" font-size="10.5" class="m sans">Your reason (optional)</text><text x="16.0" y="470.0" font-size="11" class="selF sans">Session export-api ›</text><text x="190.0" y="470.0" font-size="11" class="selF sans">Open on GitHub ›</text><path d="M0 638.5H360" class="ln"/><text x="16.0" y="655.0" font-size="9.5" class="m sans">Lowest PR: approve merges it.</text><rect x="16.0" y="666.0" width="106.5" height="34.0" rx="9" class="nowF"/><text x="69.2" y="687.0" font-size="11" class="bg sans" text-anchor="middle" font-weight="600">Approve</text><rect x="130.5" y="666.0" width="110.7" height="34.0" rx="9" class="bg"/><rect x="130.5" y="666.0" width="110.7" height="34.0" rx="9" fill="none" class="nowS" stroke-width="1.3"/><text x="185.8" y="687.0" font-size="11" class="nowF sans" text-anchor="middle" font-weight="600">Comment</text><rect x="249.2" y="666.0" width="94.8" height="34.0" rx="9" class="bg"/><rect x="249.2" y="666.0" width="94.8" height="34.0" rx="9" fill="none" class="nowS" stroke-width="1.3"/><text x="296.6" y="687.0" font-size="11" class="nowF sans" text-anchor="middle" font-weight="600">Reject</text></g></svg>